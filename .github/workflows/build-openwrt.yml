name: Build OpenWrt sing-box

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 1.12.25)'
        required: true
        default: '1.12.25'

env:
  GO_VERSION: '1.23'
  BUILD_TAGS: 'with_utls'

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: arm64
            goos: linux
            goarch: arm64
            gomips: ''
          - name: amd64
            goos: linux
            goarch: amd64
            gomips: ''
          - name: mt7621
            goos: linux
            goarch: mipsle
            gomips: softfloat

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOMIPS: ${{ matrix.gomips }}
        run: |
          go build -trimpath \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ steps.version.outputs.version }}' -s -w -buildid=" \
            -tags "${{ env.BUILD_TAGS }}" \
            -o sing-box_${{ steps.version.outputs.version }}_openwrt_${{ matrix.name }} \
            ./cmd/sing-box

      - name: Show binary info
        run: |
          ls -lh sing-box_*
          file sing-box_*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box_${{ steps.version.outputs.version }}_openwrt_${{ matrix.name }}
          path: sing-box_${{ steps.version.outputs.version }}_openwrt_${{ matrix.name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts/

      - name: Compute Tag & Title
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.ref_name }}-v${{ github.event.inputs.version || '1.12.25' }}"
            TITLE="sing-box 1.12.25 (${{ github.ref_name }})"
          else
            TAG_NAME="${{ github.ref_name }}"
            TITLE="sing-box ${{ github.ref_name }}"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.title }}
          body: |
            ## ${{ steps.release_info.outputs.title }}

            Phiên bản tối ưu chuyên biệt cho Router OpenWrt:
            - **Cổng cất cánh tuần tự**: Khóa POSIX `flock` + Dự báo RAM an toàn (chống sập khi Passwall2 nạp nhiều node).
            - **Kích thước siêu nhẹ**: Binary chỉ ~14.6MB (ARM64).
            - **Build tags**: `with_utls`.

            ### Danh sách Binary Đính kèm:
            - `sing-box_*_openwrt_arm64`: Router ARM64 (Cortex-A53 / MT7981)
            - `sing-box_*_openwrt_amd64`: Mini PC x86 / AMD64
            - `sing-box_*_openwrt_mt7621`: Router MIPSle (softfloat)
          files: artifacts/*
          draft: false
          prerelease: false
